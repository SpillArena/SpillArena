<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FleetBot"><title>FleetBot</title><style>.ship-hull {
  fill: #8e999f;
  stroke: #232b31;
  stroke-width: 1.4;
  vector-effect: non-scaling-stroke;
}
.ship-flightdeck {
  fill: #4a5258;
}
.ship-teak {
  fill: #b49b74;
}
.ship-tower {
  fill: #a9b3b9;
  stroke: #232b31;
  stroke-width: 0.8;
  vector-effect: non-scaling-stroke;
}
.ship-mast {
  fill: #5c666c;
}
.ship-funnel {
  fill: #5c666c;
  stroke: #1d2328;
  stroke-width: 0.8;
  vector-effect: non-scaling-stroke;
}
.ship-turret {
  fill: #8e999f;
  stroke: #232b31;
  stroke-width: 0.8;
  vector-effect: non-scaling-stroke;
}
.ship-gun {
  fill: #5c666c;
}
.ship-vls {
  fill: #4a5258;
}
.ship-hatch {
  fill: #5c666c;
}
.ship-helideck {
  fill: #4a5258;
}
.ship-elevator {
  fill: #353c42;
}
.ship-mark {
  fill: none;
  stroke: #eef2f4;
  vector-effect: non-scaling-stroke;
}
.ship-mark-dash {
  stroke-width: 1.2;
  stroke-dasharray: 6 5;
}
.ship-mark-thin {
  stroke-width: 0.7;
  opacity: 0.8;
}
.ship-mark-cat {
  stroke: #e9c84a;
  stroke-width: 0.9;
}
.ship-jet {
  fill: #9aa4ab;
  stroke: #2a3137;
  stroke-width: 0.5;
  vector-effect: non-scaling-stroke;
}
.ship-jet-line {
  fill: none;
  stroke: #4b545b;
  stroke-width: 0.9;
  stroke-linecap: round;
}
.ship-canopy {
  fill: #c9a43c;
}
.ship-dome {
  fill: #d3d9dd;
  stroke: #2a3137;
  stroke-width: 0.5;
  vector-effect: non-scaling-stroke;
}
.ship-sub,
.ship-sub-rudder {
  fill: #1b2024;
  stroke: #000;
}
.ship-sub-ridge {
  stroke: #3b444b;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.ship-sail {
  fill: #2a3238;
  stroke: #000;
  stroke-width: 0.8;
  vector-effect: non-scaling-stroke;
}

