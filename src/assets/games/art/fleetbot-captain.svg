<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="236" height="236" class="captain-portrait rank-extreme mood-smug " overflow="visible"><style>.captain-portrait { --cap-hull: #c4d2dc; --cap-hull-dark: #7f96a6; --cap-navy: #12324d; --cap-ink: #0c1e2e; flex: 0 0 auto; overflow: visible; }.captain-portrait .cap-head { fill: #c4d2dc; stroke: #7f96a6; stroke-width: 1.5; }.captain-portrait .cap-bolt { fill: #7f96a6; }.captain-portrait .cap-visor { fill: #0c1e2e; }.captain-portrait .cap-eyes circle { fill: #ffb703; }.captain-portrait .cap-lid { fill: #0c1e2e; }.captain-portrait .cap-brow { stroke: #0c1e2e; stroke-width: 2.4; stroke-linecap: round; fill: none; }.captain-portrait .cap-mouth { stroke: #0c1e2e; stroke-width: 2.4; stroke-linecap: round; fill: none; }.captain-portrait .cap-tear { fill: #5aa9e6; }.captain-portrait .cap-hat { fill: #12324d; }.captain-portrait .cap-band { fill: #f4f7f9; }.captain-portrait .cap-peak { fill: #0c1e2e; }.captain-portrait .cap-badge { fill: #ffb703; stroke: #8a5a00; stroke-width: 0.8; }.captain-portrait .cap-anchor { stroke: #5a3a00; stroke-width: 1; stroke-linecap: round; fill: none; }.captain-portrait.mood-angry .cap-eyes circle { fill: #ff3b30; }.captain-portrait .cap-cadet-cap { fill: #f4f7f9; stroke: #b8c6d1; stroke-width: 1; }.captain-portrait .cap-cadet-band { fill: #3d8fd6; }.captain-portrait .cap-cadet-brim { fill: #dfe8ee; stroke: #b8c6d1; stroke-width: 0.8; }.captain-portrait .cap-duck circle:not(.cap-duck-eye) { fill: #ffd43b; }.captain-portrait .cap-duck-beak { fill: #ff8a1f; }.captain-portrait .cap-duck-eye { fill: #0c1e2e; }.captain-portrait .cap-freckle { fill: #8aa0b0; }.captain-portrait .cap-pipe { stroke: #6b4423; stroke-width: 2.4; stroke-linecap: round; fill: none; }.captain-portrait .cap-pipe-bowl { fill: #6b4423; }.captain-portrait .cap-braid { stroke: #ffb703; stroke-width: 1.4; fill: none; }.captain-portrait .cap-patch { fill: #11161b; }.captain-portrait .cap-strap { stroke: #11161b; stroke-widt