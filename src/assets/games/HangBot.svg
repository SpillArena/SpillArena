<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="HangBot poster - letter tiles spelling HANG with one blank tile, a countdown ring and a letter rack">
  <title>HangBot poster - letter tiles spelling HANG with one blank tile, a countdown ring and a letter rack</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150609"/>
      <stop offset="100%" stop-color="#340f16"/>
    </linearGradient>
    <radialGradient id="mesh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48,0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="675" fill="url(#gridFade)"/></mask>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#150609" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#150609" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#150609" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vscrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%" stop-color="#150609" stop-opacity="0"/>
      <stop offset="100%" stop-color="#150609" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#b91c3c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#base)"/>
  <rect width="1200" height="675" fill="url(#grid)" mask="url(#gridMask)"/>
  <ellipse cx="905" cy="290" rx="340" ry="300" fill="url(#mesh1)" filter="url(#soft)"/>
  <ellipse cx="1140" cy="600" rx="280" ry="230" fill="url(#mesh2)" filter="url(#soft)"/>
  <ellipse cx="180" cy="40" rx="260" ry="180" fill="url(#mesh2)" filter="url(#soft)" opacity="0.5"/>
  <path d="M-60,700 L520,-40" stroke="url(#streak)" stroke-width="2.5" fill="none"/>
  <path d="M120,720 L700,-20" stroke="url(#streak)" stroke-width="1.2" fill="none" opacity="0.6"/>
  <rect width="1200" height="675" fill="url(#scrim)"/>
  <rect width="1200" height="675" fill="url(#vscrim)"/>
  <rect width="1200" height="675" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay"/>

  <!-- hero -->
  <g>
    <!-- countdown ring, roughly two thirds spent -->
    <circle cx="890" cy="330" r="216" fill="none" stroke="#fca5a5" stroke-opacity="0.14" stroke-width="10"/>
    <circle cx="890" cy="330" r="216" fill="none" stroke="url(#wordmark)" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="910 447" transform="rotate(-90 890 330)" opacity="0.9"/>
    <circle cx="890" cy="330" r="242" fill="none" stroke="#fca5a5" stroke-opacity="0.16" stroke-dasharray="2 14"/>

    <g transform="translate(726,300) rotate(-6)">
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#gloss)"/>
      <text x="0" y="15" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="41" fill="#ffffff">H</text>
    </g>
    <g transform="translate(808,300) rotate(3)">
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#gloss)"/>
      <text x="0" y="15" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="41" fill="#ffffff">A</text>
    </g>
    <g transform="translate(890,300) rotate(-3)">
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#gloss)"/>
      <text x="0" y="15" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="41" fill="#ffffff">N</text>
    </g>
    <g transform="translate(972,300) rotate(5)">
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="url(#gloss)"/>
      <text x="0" y="15" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="41" fill="#ffffff">G</text>
    </g>
    <g transform="translate(1054,300) rotate(-4)">
      <rect x="-35" y="-35" width="70" height="70" rx="17" fill="#3f0d15" fill-opacity="0.8" stroke="#fca5a5" stroke-width="3" stroke-dasharray="8 9"/>
      <text x="0" y="15" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="41" fill="#fca5a5">?</text>
    </g>

    <!-- guesses left -->
    <rect x="788" y="386" width="22" height="8" rx="4" fill="#f87171"/>
    <rect x="822" y="386" width="22" height="8" rx="4" fill="#f87171"/>
    <rect x="856" y="386" width="22" height="8" rx="4" fill="#f87171"/>
    <rect x="890" y="386" width="22" height="8" rx="4" fill="#f87171"/>
    <rect x="924" y="386" width="22" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="958" y="386" width="22" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>

    <!-- letter rack -->
    <g transform="translate(726,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#fca5a5" stroke-opacity="0.18"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#ffffff" fill-opacity="0.72">E</text>
    </g>
    <g transform="translate(768,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#fca5a5" stroke-opacity="0.18"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#ffffff" fill-opacity="0.72">R</text>
    </g>
    <g transform="translate(810,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#fca5a5" stroke-opacity="0.45"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#fca5a5" fill-opacity="0.95">S</text>
    </g>
    <g transform="translate(852,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#fca5a5" stroke-opacity="0.18"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#ffffff" fill-opacity="0.72">T</text>
    </g>
    <g transform="translate(894,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#fca5a5" stroke-opacity="0.45"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#fca5a5" fill-opacity="0.95">L</text>
    </g>
    <g transform="translate(936,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#fca5a5" stroke-opacity="0.18"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#ffffff" fill-opacity="0.72">N</text>
    </g>
    <g transform="translate(978,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#fca5a5" stroke-opacity="0.18"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#ffffff" fill-opacity="0.72">I</text>
    </g>
    <g transform="translate(1020,430)">
      <rect width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#fca5a5" stroke-opacity="0.45"/>
      <text x="17" y="23" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" fill="#fca5a5" fill-opacity="0.95">O</text>
    </g>
  </g>

  <!-- left column -->
  <g transform="translate(58,176)">
    <rect width="159" height="40" rx="20" fill="#3f0d15" fill-opacity="0.75" stroke="#fecaca" stroke-opacity="0.45"/>
    <circle cx="24" cy="20" r="5" fill="#fecaca"/>
    <text x="40" y="26" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="1.6" fill="#fecaca">WORD DUEL</text>
  </g>
  <text x="56" y="306" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-2" fill="#ffffff">HANG</text>
  <text x="56" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-2" fill="url(#wordmark)">BOT</text>
  <rect x="58" y="424" width="72" height="5" rx="2.5" fill="url(#wordmark)"/>
  <text x="58" y="470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="21" fill="#c49aa0">Crack the word before the guesses run out.</text>
  <g transform="translate(58,500)" opacity="0.72">
    <polygon points="13,0 26,7.5 26,22.5 13,30 0,22.5 0,7.5" fill="none" stroke="#fecaca" stroke-width="1.6"/>
    <text x="13" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="11" fill="#fecaca">SA</text>
    <text x="40" y="20" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.6" fill="#c49aa0">SPILLARENA</text>
  </g>
</svg>
