<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="AtlasMaster poster - a wireframe globe with map pins and chips for Europe, Asia, Africa, South America, USA and Norway">
  <title>AtlasMaster poster - a wireframe globe with map pins and chips for Europe, Asia, Africa, South America, USA and Norway</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a1e"/>
      <stop offset="100%" stop-color="#161038"/>
    </linearGradient>
    <radialGradient id="mesh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48,0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="675" fill="url(#gridFade)"/></mask>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070a1e" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#070a1e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#070a1e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vscrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%" stop-color="#070a1e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#070a1e" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#base)"/>
  <rect width="1200" height="675" fill="url(#grid)" mask="url(#gridMask)"/>
  <ellipse cx="905" cy="290" rx="340" ry="300" fill="url(#mesh1)" filter="url(#soft)"/>
  <ellipse cx="1140" cy="600" rx="280" ry="230" fill="url(#mesh2)" filter="url(#soft)"/>
  <ellipse cx="180" cy="40" rx="260" ry="180" fill="url(#mesh2)" filter="url(#soft)" opacity="0.5"/>
  <path d="M-60,700 L520,-40" stroke="url(#streak)" stroke-width="2.5" fill="none"/>
  <path d="M120,720 L700,-20" stroke="url(#streak)" stroke-width="1.2" fill="none" opacity="0.6"/>
  <rect width="1200" height="675" fill="url(#scrim)"/>
  <rect width="1200" height="675" fill="url(#vscrim)"/>
  <rect width="1200" height="675" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay"/>

  <!-- hero -->
  <g>
    <!-- orbit -->
    <circle cx="890" cy="292" r="214" fill="none" stroke="#a5b4fc" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="3 13"/>
    <circle cx="890" cy="292" r="176" fill="#1b1442" fill-opacity="0.55"/>

    <!-- globe -->
    <g transform="translate(890,292)">
      <g fill="none" stroke="#93c5fd" stroke-opacity="0.55" stroke-width="1.6">
        <ellipse rx="58" ry="158"/>
        <ellipse rx="112" ry="158" stroke-opacity="0.38"/>
        <ellipse rx="158" ry="54"/>
        <ellipse rx="158" ry="106" stroke-opacity="0.38"/>
        <line x1="-158" y1="0" x2="158" y2="0" stroke-opacity="0.3"/>
      </g>
      <!-- abstract landmasses -->
      <g fill="#818cf8" fill-opacity="0.72" stroke="#c7d2fe" stroke-opacity="0.6" stroke-width="1.5">
        <path d="M-104,-92 C-74,-114 -34,-110 -18,-86 C-8,-70 -22,-58 -34,-48 C-44,-40 -50,-24 -62,-28 C-80,-34 -104,-62 -104,-92 Z"/>
        <path d="M6,-96 C44,-112 96,-98 118,-72 C132,-56 116,-40 92,-38 C70,-36 56,-46 40,-44 C22,-42 2,-58 -2,-74 C-4,-84 -2,-92 6,-96 Z"/>
        <path d="M2,-16 C24,-22 42,-6 40,22 C38,52 24,80 8,86 C-6,90 -14,72 -12,50 C-10,26 -12,-10 2,-16 Z"/>
        <path d="M-80,14 C-58,6 -44,24 -48,52 C-52,80 -70,106 -86,98 C-100,90 -100,52 -92,32 C-88,22 -86,16 -80,14 Z"/>
        <path d="M86,54 C102,48 116,58 114,70 C112,82 96,88 86,80 C78,74 76,58 86,54 Z"/>
      </g>
      <circle r="158" fill="none" stroke="#c7d2fe" stroke-opacity="0.75" stroke-width="2.5"/>
    </g>

    <!-- pins -->
    <g>
      <g transform="translate(818,204)">
        <path d="M0,-22 C13,-22 22,-13 22,0 C22,16 0,34 0,34 C0,34 -22,16 -22,0 C-22,-13 -13,-22 0,-22 Z" fill="#f472b6" stroke="#fbcfe8" stroke-width="2"/>
        <circle r="7" fill="#ffffff"/>
      </g>
      <g transform="translate(986,248) scale(0.78)">
        <path d="M0,-22 C13,-22 22,-13 22,0 C22,16 0,34 0,34 C0,34 -22,16 -22,0 C-22,-13 -13,-22 0,-22 Z" fill="#93c5fd" stroke="#dbeafe" stroke-width="2"/>
        <circle r="7" fill="#ffffff"/>
      </g>
      <g transform="translate(906,378) scale(0.64)">
        <path d="M0,-22 C13,-22 22,-13 22,0 C22,16 0,34 0,34 C0,34 -22,16 -22,0 C-22,-13 -13,-22 0,-22 Z" fill="#a78bfa" stroke="#ede9fe" stroke-width="2"/>
        <circle r="7" fill="#ffffff"/>
      </g>
    </g>

    <!-- playable maps -->
    <g>
      <g transform="translate(765,486)">
        <rect width="84" height="28" rx="14" fill="#1b1442" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45"/>
        <text x="42" y="19" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2" fill="#c7d2fe">EUROPE</text>
      </g>
      <g transform="translate(861,486)">
        <rect width="62" height="28" rx="14" fill="#1b1442" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45"/>
        <text x="31" y="19" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2" fill="#c7d2fe">ASIA</text>
      </g>
      <g transform="translate(935,486)">
        <rect width="80" height="28" rx="14" fill="#1b1442" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45"/>
        <text x="40" y="19" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2" fill="#c7d2fe">AFRICA</text>
      </g>
      <g transform="translate(749,522)">
        <rect width="116" height="28" rx="14" fill="#1b1442" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45"/>
        <text x="58" y="19" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2" fill="#c7d2fe">S. AMERICA</text>
      </g>
      <g transform="translate(877,522)">
        <rect width="56" height="28" rx="14" fill="#1b1442" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45"/>
        <text x="28" y="19" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2" fill="#c7d2fe">USA</text>
      </g>
      <g transform="translate(945,522)">
        <rect width="86" height="28" rx="14" fill="#1b1442" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45"/>
        <text x="43" y="19" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2" fill="#c7d2fe">NORWAY</text>
      </g>
    </g>
  </g>

  <!-- left column -->
  <g transform="translate(58,176)">
    <rect width="202" height="40" rx="20" fill="#1b1442" fill-opacity="0.75" stroke="#c7d2fe" stroke-opacity="0.45"/>
    <circle cx="24" cy="20" r="5" fill="#c7d2fe"/>
    <text x="40" y="26" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="1.6" fill="#c7d2fe">GEO CHALLENGE</text>
  </g>
  <text x="56" y="306" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-2" fill="#ffffff">ATLAS</text>
  <text x="56" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-2" fill="url(#wordmark)">MASTER</text>
  <rect x="58" y="424" width="72" height="5" rx="2.5" fill="url(#wordmark)"/>
  <text x="58" y="470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="21" fill="#9aa0cf">Six maps. Countries, capitals, speed.</text>
  <g transform="translate(58,500)" opacity="0.72">
    <polygon points="13,0 26,7.5 26,22.5 13,30 0,22.5 0,7.5" fill="none" stroke="#c7d2fe" stroke-width="1.6"/>
    <text x="13" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="11" fill="#c7d2fe">SA</text>
    <text x="40" y="20" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.6" fill="#9aa0cf">SPILLARENA</text>
  </g>
</svg>
