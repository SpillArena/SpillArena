<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="FleetBot poster - an isometric battleship grid with sonar rings and a direct hit">
  <title>FleetBot poster - an isometric battleship grid with sonar rings and a direct hit</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="100%" stop-color="#0a1a30"/>
    </linearGradient>
    <radialGradient id="mesh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48,0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="675" fill="url(#gridFade)"/></mask>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050b16" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#050b16" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050b16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vscrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%" stop-color="#050b16" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050b16" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#base)"/>
  <rect width="1200" height="675" fill="url(#grid)" mask="url(#gridMask)"/>
  <ellipse cx="905" cy="290" rx="340" ry="300" fill="url(#mesh1)" filter="url(#soft)"/>
  <ellipse cx="1140" cy="600" rx="280" ry="230" fill="url(#mesh2)" filter="url(#soft)"/>
  <ellipse cx="180" cy="40" rx="260" ry="180" fill="url(#mesh2)" filter="url(#soft)" opacity="0.5"/>
  <path d="M-60,700 L520,-40" stroke="url(#streak)" stroke-width="2.5" fill="none"/>
  <path d="M120,720 L700,-20" stroke="url(#streak)" stroke-width="1.2" fill="none" opacity="0.6"/>
  <rect width="1200" height="675" fill="url(#scrim)"/>
  <rect width="1200" height="675" fill="url(#vscrim)"/>
  <rect width="1200" height="675" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay"/>

  <!-- hero -->
  <g>
    <!-- sonar rings -->
    <g fill="none" stroke="#7dd3fc" stroke-opacity="0.3">
      <ellipse cx="890" cy="342" rx="180" ry="112" stroke-dasharray="3 12"/>
      <ellipse cx="890" cy="342" rx="235" ry="146" stroke-dasharray="3 12" stroke-opacity="0.2"/>
      <ellipse cx="890" cy="342" rx="292" ry="181" stroke-dasharray="3 12" stroke-opacity="0.12"/>
    </g>

    <!-- isometric battle grid -->
    <g transform="translate(890,342) scale(1,0.62) rotate(45)">
      <rect x="-138" y="-138" width="276" height="276" rx="8" fill="#0b1d34" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
      <g stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5">
      <line x1="-92" y1="-138" x2="-92" y2="138"/>
      <line x1="-138" y1="-92" x2="138" y2="-92"/>
      <line x1="-46" y1="-138" x2="-46" y2="138"/>
      <line x1="-138" y1="-46" x2="138" y2="-46"/>
      <line x1="0" y1="-138" x2="0" y2="138"/>
      <line x1="-138" y1="0" x2="138" y2="0"/>
      <line x1="46" y1="-138" x2="46" y2="138"/>
      <line x1="-138" y1="46" x2="138" y2="46"/>
      <line x1="92" y1="-138" x2="92" y2="138"/>
      <line x1="-138" y1="92" x2="138" y2="92"/>
      </g>
      <!-- ship -->
      <g transform="translate(-92,46)">
        <rect x="-20" y="-19" width="178" height="38" rx="19" fill="#0e3a5c" stroke="#7dd3fc" stroke-width="2.5"/>
        <circle cx="30" cy="0" r="9" fill="#7dd3fc" fill-opacity="0.55"/>
        <circle cx="76" cy="0" r="9" fill="#7dd3fc" fill-opacity="0.55"/>
        <circle cx="122" cy="0" r="9" fill="#7dd3fc" fill-opacity="0.55"/>
      </g>
      <circle cx="-115" cy="-69" r="7" fill="#e2e8f0" fill-opacity="0.35"/>
      <circle cx="-23" cy="69" r="7" fill="#e2e8f0" fill-opacity="0.35"/>
      <circle cx="69" cy="-115" r="7" fill="#e2e8f0" fill-opacity="0.35"/>
      <circle cx="-69" cy="115" r="7" fill="#e2e8f0" fill-opacity="0.35"/>
      <circle cx="115" cy="23" r="7" fill="#e2e8f0" fill-opacity="0.35"/>
    </g>
    <g transform="translate(923,342)">
      <circle r="21" fill="#fb7185" fill-opacity="0.18"/>
      <circle r="15" fill="#fb7185"/>
      <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(890,322)">
      <circle r="21" fill="#fb7185" fill-opacity="0.18"/>
      <circle r="15" fill="#fb7185"/>
      <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- strike beam over the last hit -->
    <path d="M908,342 L936,342 L958,150 L886,150 Z" fill="url(#beam)"/>

    <!-- reticle -->
    <g transform="translate(1046,196)" stroke="#bae6fd" stroke-opacity="0.85" fill="none" stroke-width="2.5" stroke-linecap="round">
      <circle r="26" stroke-dasharray="26 18"/>
      <path d="M0,-40 L0,-30 M0,30 L0,40 M-40,0 L-30,0 M30,0 L40,0"/>
      <circle r="4" fill="#fb7185" stroke="none"/>
    </g>
  </g>

  <!-- left column -->
  <g transform="translate(58,176)">
    <rect width="213" height="40" rx="20" fill="#0c2038" fill-opacity="0.75" stroke="#bae6fd" stroke-opacity="0.45"/>
    <circle cx="24" cy="20" r="5" fill="#bae6fd"/>
    <text x="40" y="26" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="1.6" fill="#bae6fd">NAVAL STRATEGY</text>
  </g>
  <text x="56" y="306" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-2" fill="#ffffff">FLEET</text>
  <text x="56" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-2" fill="url(#wordmark)">BOT</text>
  <rect x="58" y="424" width="72" height="5" rx="2.5" fill="url(#wordmark)"/>
  <text x="58" y="470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="21" fill="#8aa4bf">Outsmart the bot. Sink the fleet.</text>
  <g transform="translate(58,500)" opacity="0.72">
    <polygon points="13,0 26,7.5 26,22.5 13,30 0,22.5 0,7.5" fill="none" stroke="#bae6fd" stroke-width="1.6"/>
    <text x="13" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="11" fill="#bae6fd">SA</text>
    <text x="40" y="20" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.6" fill="#8aa4bf">SPILLARENA</text>
  </g>
</svg>
