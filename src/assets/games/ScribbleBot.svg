<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ScribbleBot poster - a hand-drawn rocket on a canvas with guesses arriving in chat bubbles">
  <title>ScribbleBot poster - a hand-drawn rocket on a canvas with guesses arriving in chat bubbles</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04120c"/>
      <stop offset="100%" stop-color="#072a1c"/>
    </linearGradient>
    <radialGradient id="mesh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48,0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="675" fill="url(#gridFade)"/></mask>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04120c" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#04120c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#04120c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vscrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%" stop-color="#04120c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04120c" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#base)"/>
  <rect width="1200" height="675" fill="url(#grid)" mask="url(#gridMask)"/>
  <ellipse cx="905" cy="290" rx="340" ry="300" fill="url(#mesh1)" filter="url(#soft)"/>
  <ellipse cx="1140" cy="600" rx="280" ry="230" fill="url(#mesh2)" filter="url(#soft)"/>
  <ellipse cx="180" cy="40" rx="260" ry="180" fill="url(#mesh2)" filter="url(#soft)" opacity="0.5"/>
  <path d="M-60,700 L520,-40" stroke="url(#streak)" stroke-width="2.5" fill="none"/>
  <path d="M120,720 L700,-20" stroke="url(#streak)" stroke-width="1.2" fill="none" opacity="0.6"/>
  <rect width="1200" height="675" fill="url(#scrim)"/>
  <rect width="1200" height="675" fill="url(#vscrim)"/>
  <rect width="1200" height="675" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay"/>

  <!-- hero -->
  <g>
    <!-- canvas frame -->
    <g transform="translate(686,152)">
      <rect width="424" height="340" rx="28" fill="#062016" fill-opacity="0.72" stroke="#4ade80" stroke-opacity="0.35" stroke-width="2"/>
      <g stroke="#4ade80" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round">
        <path d="M26,24 L26,54 M26,24 L56,24"/>
        <path d="M398,24 L398,54 M398,24 L368,24"/>
        <path d="M26,316 L26,286 M26,316 L56,316"/>
        <path d="M398,316 L398,286 M398,316 L368,316"/>
      </g>
    </g>

    <!-- one-stroke doodle: a rocket -->
    <g transform="translate(898,322) scale(0.88) translate(-898,-322)">
      <g fill="none" stroke="#86efac" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M868,406 C830,368 828,300 858,254 C878,222 906,200 926,190 C946,200 974,222 994,254 C1024,300 1022,368 984,406 C960,418 892,418 868,406 Z"/>
        <path d="M868,392 C836,394 812,414 806,444 C838,442 858,430 870,414"/>
        <path d="M984,392 C1016,394 1040,414 1046,444 C1014,442 994,430 982,414"/>
      </g>
      <circle cx="926" cy="266" r="26" fill="none" stroke="#4ade80" stroke-width="7"/>
      <path d="M896,424 C906,446 918,458 926,470 C934,458 946,446 956,424" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 14" opacity="0.9"/>
    </g>

    <!-- the pen, still mid-stroke -->
    <g transform="translate(1024,428) rotate(32)">
      <path d="M0,20 L-12,-6 L12,-6 Z" fill="#bbf7d0"/>
      <rect x="-13" y="-56" width="26" height="50" rx="8" fill="#14532d" stroke="#bbf7d0" stroke-width="2.5"/>
      <line x1="0" y1="-46" x2="0" y2="-18" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- guesses coming in -->
    <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
      <g transform="translate(662,206)">
        <rect width="150" height="44" rx="22" fill="#0b3222" stroke="#4ade80" stroke-opacity="0.45"/>
        <path d="M22,44 L34,58 L44,44 Z" fill="#0b3222"/>
        <text x="20" y="29" font-size="17" fill="#86efac">banana?</text>
      </g>
      <g transform="translate(956,134)">
        <rect width="172" height="46" rx="23" fill="#14532d" stroke="#86efac" stroke-opacity="0.7"/>
        <path d="M112,46 L124,60 L136,46 Z" fill="#14532d"/>
        <text x="20" y="30" font-size="18" fill="#ecfdf5">ROCKET!</text>
        <circle cx="152" cy="23" r="6" fill="#4ade80"/>
      </g>
    </g>

    <!-- sparks -->
    <g fill="#bbf7d0">
      <path d="M1134,262 l5,14 14,5 -14,5 -5,14 -5,-14 -14,-5 14,-5 z" opacity="0.8"/>
      <path d="M646,392 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 z" opacity="0.6"/>
    </g>
  </g>

  <!-- left column -->
  <g transform="translate(58,176)">
    <rect width="191" height="40" rx="20" fill="#0b3222" fill-opacity="0.75" stroke="#bbf7d0" stroke-opacity="0.45"/>
    <circle cx="24" cy="20" r="5" fill="#bbf7d0"/>
    <text x="40" y="26" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="1.6" fill="#bbf7d0">DRAW &amp; GUESS</text>
  </g>
  <text x="56" y="306" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="70" letter-spacing="-2" fill="#ffffff">SCRIBBLE</text>
  <text x="56" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="-2" fill="url(#wordmark)">BOT</text>
  <rect x="58" y="424" width="72" height="5" rx="2.5" fill="url(#wordmark)"/>
  <text x="58" y="470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="21" fill="#8dbca4">The bot draws. You shout the answer.</text>
  <g transform="translate(58,500)" opacity="0.72">
    <polygon points="13,0 26,7.5 26,22.5 13,30 0,22.5 0,7.5" fill="none" stroke="#bbf7d0" stroke-width="1.6"/>
    <text x="13" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="11" fill="#bbf7d0">SA</text>
    <text x="40" y="20" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.6" fill="#8dbca4">SPILLARENA</text>
  </g>
</svg>
