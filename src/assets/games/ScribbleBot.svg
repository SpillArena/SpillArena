<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03130c"/>
      <stop offset="100%" stop-color="#0a2b1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="48%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="blur1"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <circle cx="900" cy="300" r="260" fill="url(#glow)" filter="url(#blur1)"/>
  <line x1="-40" y1="700" x2="560" y2="-40" stroke="#4ade80" stroke-width="3" opacity="0.35"/>
  <rect width="1200" height="675" fill="url(#scrim)"/>

  <!-- doodle swoosh forming a smiley -->
  <g fill="none" stroke="#86efac" stroke-width="6" stroke-linecap="round">
    <path d="M760,300 C800,220 900,180 980,220 C1060,260 1080,340 1040,400 C1000,460 900,470 840,430 C790,398 770,350 780,320" />
  </g>
  <circle cx="880" cy="300" r="9" fill="#4ade80"/>
  <circle cx="960" cy="290" r="9" fill="#4ade80"/>
  <path d="M865,360 Q915,410 975,355" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>

  <!-- pen nib at line end -->
  <g transform="translate(780,320) rotate(35)">
    <path d="M0,-16 L14,0 L0,16 L-14,0 Z" fill="#166534" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#bbf7d0"/>
  </g>

  <!-- sparkle stars -->
  <g fill="#bbf7d0">
    <path d="M1050,190 l6,16 16,6 -16,6 -6,16 -6,-16 -16,-6 16,-6 z" opacity="0.9"/>
    <path d="M1090,320 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 z" opacity="0.7"/>
    <path d="M740,430 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 z" opacity="0.7"/>
  </g>

  <!-- genre pill -->
  <g transform="translate(60,56)">
    <rect width="210" height="40" rx="20" fill="#0a2b1d" stroke="#4ade80" stroke-opacity="0.5"/>
    <path d="M18,24 L26,10 L30,14 L22,28 Z" fill="#86efac"/>
    <text x="42" y="26" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="1.5" fill="#bbf7d0">DRAW &amp; GUESS</text>
  </g>

  <!-- wordmark -->
  <text x="58" y="560" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="#ffffff">SCRIBBLE</text>
  <text x="58" y="636" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="88" letter-spacing="-1" fill="#4ade80">BOT</text>
  <text x="64" y="468" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="21" fill="#8fbfa2">Draw it. Guess it. Laugh about it.</text>

  <!-- brand mark -->
  <g transform="translate(1128,612)" opacity="0.9">
    <polygon points="20,0 40,12 40,28 20,40 0,28 0,12" fill="none" stroke="#e879f9" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="14" fill="#e879f9">SA</text>
  </g>
</svg>
