name = "spillarena"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[vars]
SMTP_HOST = "ymirsgren.domene.no"
SMTP_USER = "support@spillarena.no"
CONTACT_FROM = "SpillArena <support@spillarena.no>"
CONTACT_TO = "support@spillarena.no"
# SMTP_PASSWORD is a Pages secret / local .dev.vars value, never a VITE_ variable.
# Zone analytics covers the proxied spillarena.no domain and its subdomains.
CLOUDFLARE_ZONE_ID = "6f25392856334fce2113901f1b78bb60"
# CLOUDFLARE_ANALYTICS_TOKEN belongs in Pages secrets / local .dev.vars.

# Databasen for HELE domenet — kontoer OG ledertavler.
#
# Spillene ligger på samme opphav — spillarena.no/<spill> er routeren som
# strippar prefikset før han proxyar vidare — så /api/* her er det ene stedet
# alle spillene snakker med om identitet.
#
# Hvert spill hadde tidligere sin egen D1-database. Det var seks databaser med
# til sammen førtito rader, og gratisplanen tåler ti databaser i kontoen. Å
# slå dem sammen sparer IKKE kvote: radlesninger, radskrivinger og lagring
# telles per konto, ikke per database. Det det sparer er antallet databaser,
# og at skjemaet har ett sted å bo.
#
# FleetBot hadde egen database lengst, fordi rommene ble pollet fra D1 hvert
# halve sekund. Rommene bor nå i Durable Objects i Workeren `fleetbot-rooms`,
# og tavla er flyttet hit (migrasjon 0012). Workeren har bindingen til denne
# databasen; FleetBot sitt Pages-prosjekt har ingen.
#
# MIGRASJONENE HER EIER HELE SKJEMAET, også spillenes tavler. `d1_migrations`
# er én tabell per database med UNIQUE på navnet: hadde hvert spill beholdt sin
# egen migrations-mappe mot denne databasen, ville fire `0001_*.sql` kollidert.
# Spillene har derfor bindingen, men ingen migrations_dir.
[[d1_databases]]
binding = "DB"
database_name = "spillarena-hub"
database_id = "01624d56-fcd9-495d-9dd7-59b59a85da81"
migrations_dir = "migrations"

# AUTH_SECRET er ikke her med vilje — en signeringsnøkkel i git er ingen nøkkel.
#
#   npx wrangler pages secret put AUTH_SECRET
#
# SAMME hemmelighet må settes på hvert spill som skal stole på et tegn herfra
# (AtlasMaster, ScribbleBot, HangBot, ProportionPanic, og Workerne
# melodyrush-rooms, hitline-rooms og fleetbot-rooms). Tegnet er signert, ikke
# kryptert: spillene verifiserer signaturen selv og trenger aldri å slå opp i
# kontodatabasen. Byttes nøkkelen ett sted, må den byttes alle steder, og alle
# innlogginger faller.
#
# Lokalt: AUTH_SECRET=... i .dev.vars (holdt utenfor av .gitignore).
